<p-toast position="bottom-right" />

<p-toolbar styleClass="app-toolbar">
  <ng-template #start>
    <span class="mr-8 inline-flex items-center gap-2 text-lg font-semibold">
      <i class="pi pi-home text-primary"></i>
      <span class="max-sm:hidden">Domotic</span>
    </span>

    <nav class="inline-flex gap-1">
      <a routerLink="/dashboard" routerLinkActive="active" class="px-3.5 py-2 rounded-content text-muted no-underline transition-colors hover:bg-content-hover hover:text-body [&.active]:bg-highlight [&.active]:text-on-highlight">Tableau de bord</a>
      <a routerLink="/devices" routerLinkActive="active" class="px-3.5 py-2 rounded-content text-muted no-underline transition-colors hover:bg-content-hover hover:text-body [&.active]:bg-highlight [&.active]:text-on-highlight">Équipements</a>
    </nav>
  </ng-template>

  <ng-template #end>
    <div class="inline-flex items-center gap-3">
      <p-tag [value]="healthTag().label" [severity]="healthTag().severity" />
      <p-button
        icon="pi pi-refresh"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        [loading]="store.loading()"
        (onClick)="store.refresh()"
        ariaLabel="Rafraîchir"
      />
    </div>
  </ng-template>
</p-toolbar>

<main class="mx-auto max-w-[90rem] p-6 max-sm:px-3 max-sm:py-4">
  <router-outlet />
</main>
