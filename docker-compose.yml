# Stack domotique pour Synology DS216+ (DSM 7.1, 1 Go de RAM).
#
# DSM 7.1 ne dispose pas de Container Manager : les commandes s'invoquent en
# SSH avec `sudo docker-compose`. Sur DSM 7.2 et au-delà, `docker compose`.

services:
  domotic:
    image: domotic:latest
    container_name: domotic
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # Base SQLite et jetons OAuth2. Ce volume porte le refresh token Netatmo :
      # le perdre impose de refaire l'authentification.
      #
      # L'image distroless tourne en nonroot (UID 65532) : le répertoire doit
      # lui appartenir, sinon le service échoue au démarrage sur
      # « unable to open database file ».
      #
      #   mkdir -p data && sudo chown -R 65532:65532 data
      - ./data:/data

    environment:
      DOMOTIC_PORT: 8080
      DOMOTIC_DB_PATH: /data/domotic.db
      DOMOTIC_PUBLIC_URL: ${DOMOTIC_PUBLIC_URL:-http://localhost:8080}

      NETATMO_CLIENT_ID: ${NETATMO_CLIENT_ID:-}
      NETATMO_CLIENT_SECRET: ${NETATMO_CLIENT_SECRET:-}
      NETATMO_SCOPES: ${NETATMO_SCOPES:-read_station read_camera access_camera}
      NETATMO_POLL_INTERVAL: ${NETATMO_POLL_INTERVAL:-10m}

      # La box TaHoma est sur le LAN : le bridge Docker par défaut suffit tant
      # que le NAS et la box partagent le même réseau.
      TAHOMA_HOST: ${TAHOMA_HOST:-}
      TAHOMA_PORT: ${TAHOMA_PORT:-8443}
      TAHOMA_PIN: ${TAHOMA_PIN:-}
      TAHOMA_TOKEN: ${TAHOMA_TOKEN:-}
      TAHOMA_EVENT_INTERVAL: ${TAHOMA_EVENT_INTERVAL:-2s}

      SHELLY_HOSTS: ${SHELLY_HOSTS:-}
      SHELLY_PASSWORD: ${SHELLY_PASSWORD:-}
      SHELLY_POLL_INTERVAL: ${SHELLY_POLL_INTERVAL:-5s}

    # Le service tient largement dans cette enveloppe ; la borne protège le NAS
    # d'une dérive plutôt qu'elle ne contraint le fonctionnement normal.
    mem_limit: 128m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

